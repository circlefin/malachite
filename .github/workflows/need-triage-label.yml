name: Auto Label Issues
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: github-hosted-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if opener is CODEOWNER
        id: check-codeowner
        # Security fix: `github.event.issue.user.login` is attacker-controlled (anyone can open
        # an issue) and was interpolated directly into the shell source, which is the documented
        # script-injection pattern. It is now passed through `env:` — the environment is not
        # evaluated as shell — and matched with `grep -qx` so a crafted login cannot match a
        # CODEOWNERS entry as a substring. This job also declares no `permissions:` block, so
        # it inherits the repository default; `contents: read` is all it needs.
        env:
          OPENER_LOGIN: ${{ github.event.issue.user.login }}
        permissions:
          contents: read
        run: |
          # Get the CODEOWNERS file content
          if [ -f .github/CODEOWNERS ]; then
            # Extract GitHub usernames from CODEOWNERS file
            CODEOWNERS=$(grep -v '^#' .github/CODEOWNERS | grep -o '@[a-zA-Z0-9-]*' | sed 's/@//')

            # Check if issue opener is in CODEOWNERS (exact match, not a prefix/substring)
            if [ -n "$OPENER_LOGIN" ] && echo "$CODEOWNERS" | grep -qxF "$OPENER_LOGIN"; then
              echo "is_codeowner=true" >> $GITHUB_OUTPUT
            else
              echo "is_codeowner=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_codeowner=false" >> $GITHUB_OUTPUT
          fi

      - name: Add need-triage label
        if: steps.check-codeowner.outputs.is_codeowner == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['need-triage']
              });
              console.log('Successfully added `need-triage` label');
            } catch (error) {
              console.log('Error adding label:', error);
            }
